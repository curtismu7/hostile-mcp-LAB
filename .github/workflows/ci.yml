name: CI
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * *'  # nightly: the full Node 20 + 22 build, so main merges do not pay for it
jobs:
  build:
    # Push to main skips this: the pull request already ran it. Pull requests run Node 22; the nightly run does 20 and 22.
    if: github.event_name != 'push'
    # Repo variable RUNS_ON (a JSON array, e.g. ["ubuntu-latest"]) overrides the self-hosted Mac default.
    runs-on: ${{ fromJSON(vars.RUNS_ON || '["self-hosted","macOS"]') }}
    strategy:
      matrix:
        # Node 22 on pull requests; 20 and 22 on push to main.
        node: ${{ fromJSON(github.event_name == 'pull_request' && '[22]' || '[20,22]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test
      - run: npm run build
  secrets:
    if: github.event_name != 'schedule'
    runs-on: ${{ fromJSON(vars.RUNS_ON || '["self-hosted","macOS"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: PATH="/opt/homebrew/bin:$PATH" gitleaks detect --source . --redact -v
